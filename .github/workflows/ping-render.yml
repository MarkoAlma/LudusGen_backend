name: Ping Render Backend

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      PING_URL: ${{ vars.RENDER_PING_URL || 'https://ludusgen-backend.onrender.com/api/health' }}
    steps:
      - name: Ping health endpoint
        run: |
          set -euo pipefail
          echo "Pinging ${PING_URL}"
          curl --fail --show-error --silent --max-time 30 --retry 2 --retry-delay 5 "${PING_URL}"
          echo
